<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор тона</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        .frequency-display {
            background-color: #f0f5ff;
            border: 2px solid #4d7cfe;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .frequency-value {
            font-size: 3.5rem;
            font-weight: bold;
            color: #2575fc;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .frequency-unit {
            font-size: 1.2rem;
            color: #666;
            margin-left: 5px;
        }
        
        .slider-container {
            margin: 40px 0;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #555;
            font-weight: 500;
        }
        
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 16px;
            border-radius: 10px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            outline: none;
            opacity: 0.9;
            transition: opacity 0.2s;
        }
        
        .slider:hover {
            opacity: 1;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            border: 3px solid #2575fc;
            transition: all 0.2s;
        }
        
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        
        .slider::-moz-range-thumb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            border: 3px solid #2575fc;
        }
        
        .button-container {
            margin-top: 40px;
        }
        
        .control-btn {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
            letter-spacing: 0.5px;
            width: 100%;
            max-width: 250px;
        }
        
        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(106, 17, 203, 0.5);
        }
        
        .control-btn:active {
            transform: translateY(1px);
        }
        
        .control-btn.stop {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }
        
        .status {
            margin-top: 25px;
            font-size: 1rem;
            color: #666;
            min-height: 24px;
        }
        
        .status.active {
            color: #2575fc;
            font-weight: 600;
        }
        
        .instructions {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #777;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .frequency-value {
                font-size: 2.8rem;
            }
            
            .control-btn {
                padding: 15px 30px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Генератор тона</h1>
        <p class="subtitle">Регулируемая частота звука</p>
        
        <div class="frequency-display">
            <div class="frequency-value" id="frequencyValue">440</div>
            <span class="frequency-unit">Гц</span>
        </div>
        
        <div class="slider-container">
            <div class="slider-label">
                <span>Низкая частота</span>
                <span>Высокая частота</span>
            </div>
            <input type="range" min="50" max="2000" value="440" class="slider" id="frequencySlider">
        </div>
        
        <div class="button-container">
            <button class="control-btn" id="controlBtn">Запустить звук</button>
        </div>
        
        <div class="status" id="status">Готов к работе</div>
        
        <div class="instructions">
            <p>Используйте ползунок для регулировки частоты звука от 50 Гц до 2000 Гц</p>
            <p>Кнопка запускает и останавливает генерацию звука</p>
        </div>
    </div>

    <script>
        // Аудиоконтекст для работы с Web Audio API
        let audioContext;
        let oscillator;
        let isPlaying = false;
        
        // Элементы DOM
        const frequencySlider = document.getElementById('frequencySlider');
        const frequencyValue = document.getElementById('frequencyValue');
        const controlBtn = document.getElementById('controlBtn');
        const status = document.getElementById('status');
        
        // Инициализация аудиоконтекста при первом взаимодействии пользователя
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // Обновление отображения частоты
        function updateFrequencyDisplay() {
            frequencyValue.textContent = frequencySlider.value;
        }
        
        // Создание и запуск осциллятора
        function startSound() {
            if (!audioContext) {
                initAudioContext();
            }
            
            // Остановить предыдущий осциллятор, если он существует
            if (oscillator) {
                oscillator.stop();
            }
            
            // Создать новый осциллятор
            oscillator = audioContext.createOscillator();
            oscillator.type = 'sine'; // Тип волны: sine, square, sawtooth, triangle
            oscillator.frequency.setValueAtTime(frequencySlider.value, audioContext.currentTime);
            
            // Подключить осциллятор к выходу
            oscillator.connect(audioContext.destination);
            
            // Запустить осциллятор
            oscillator.start();
            isPlaying = true;
            
            // Обновить UI
            controlBtn.textContent = 'Остановить звук';
            controlBtn.classList.add('stop');
            status.textContent = 'Звук воспроизводится';
            status.classList.add('active');
        }
        
        // Остановка звука
        function stopSound() {
            if (oscillator && isPlaying) {
                oscillator.stop();
                isPlaying = false;
                
                // Обновить UI
                controlBtn.textContent = 'Запустить звук';
                controlBtn.classList.remove('stop');
                status.textContent = 'Звук остановлен';
                status.classList.remove('active');
            }
        }
        
        // Обработчик изменения ползунка
        frequencySlider.addEventListener('input', function() {
            updateFrequencyDisplay();
            
            // Если звук воспроизводится, обновить частоту осциллятора
            if (isPlaying && oscillator) {
                oscillator.frequency.setValueAtTime(frequencySlider.value, audioContext.currentTime);
            }
        });
        
        // Обработчик клика по кнопке
        controlBtn.addEventListener('click', function() {
            // Инициализировать аудиоконтекст при первом клике
            if (!audioContext) {
                initAudioContext();
            }
            
            if (isPlaying) {
                stopSound();
            } else {
                startSound();
            }
        });
        
        // Остановить звук при закрытии или перезагрузке страницы
        window.addEventListener('beforeunload', function() {
            if (oscillator && isPlaying) {
                oscillator.stop();
            }
        });
        
        // Инициализация отображения частоты при загрузке
        updateFrequencyDisplay();
        
        // Добавим обработку касания для мобильных устройств
        controlBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            // Тот же код, что и для клика
            if (!audioContext) {
                initAudioContext();
            }
            
            if (isPlaying) {
                stopSound();
            } else {
                startSound();
            }
        }, { passive: false });
    </script>
</body>
</html>
