<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор спектра звука с спектрограммой</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f0f0f0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #22d3ee, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .control-btn {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 160px;
            justify-content: center;
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
        }
        
        .control-btn:active {
            transform: translateY(1px);
        }
        
        #startBtn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        #startBtn:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        
        #stopBtn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        
        #stopBtn:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }
        
        #clearBtn {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        
        #clearBtn:hover {
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.7);
            min-width: 200px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ef4444;
            transition: background-color 0.3s;
        }
        
        .status-dot.active {
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
        }
        
        .status-text {
            font-size: 1rem;
            color: #cbd5e1;
        }
        
        .visualization-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 1024px) {
            .visualization-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .visualization-container {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .visualization-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }
        
        .visualization-header h2 {
            color: #e2e8f0;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .time-indicator {
            color: #94a3b8;
            font-size: 0.9rem;
            background: rgba(30, 41, 59, 0.6);
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 350px;
            border-radius: 10px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background: #0f172a;
            width: 100%;
            height: 100%;
        }
        
        .spectrogram-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 0 10px;
        }
        
        .time-slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 70%;
        }
        
        .time-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #22d3ee, #818cf8);
            outline: none;
        }
        
        .time-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            border: 3px solid #818cf8;
        }
        
        .time-display {
            font-family: monospace;
            font-size: 0.9rem;
            color: #cbd5e1;
            min-width: 120px;
        }
        
        .color-scheme-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .color-scheme-btn {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .color-scheme-btn.active {
            border-color: white;
            transform: scale(1.1);
        }
        
        .color-scheme-btn:hover {
            transform: scale(1.05);
        }
        
        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .info-card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border-left: 4px solid #22d3ee;
        }
        
        .info-card h3 {
            color: #e2e8f0;
            margin-bottom: 15px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #22d3ee;
            margin-bottom: 5px;
        }
        
        .info-label {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .instructions {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .instructions h2 {
            color: #e2e8f0;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }
        
        .instructions ul {
            padding-left: 20px;
            color: #cbd5e1;
            line-height: 1.6;
        }
        
        .instructions li {
            margin-bottom: 10px;
        }
        
        .permission-note {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            color: #fbbf24;
            text-align: center;
            font-size: 0.95rem;
        }
        
        .freq-info {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding: 0 10px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .control-btn {
                width: 100%;
                max-width: 300px;
            }
            
            .visualization-grid {
                gap: 20px;
            }
            
            .canvas-wrapper {
                height: 300px;
            }
            
            .spectrogram-controls {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .time-slider-container {
                width: 100%;
            }
